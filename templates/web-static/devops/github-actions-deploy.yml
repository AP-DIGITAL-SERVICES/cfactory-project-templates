# Stack: web-static
# Generated by specforge
#
# Builds the static site and publishes the Docker image. Swap the final step
# for your target (S3 + CloudFront, Netlify, Vercel, GitHub Pages, etc.).
# ==============================================================================

name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: $\{{env.NODE_VERSION}}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: $\{{github.actor}}
          password: $\{{secrets.GITHUB_TOKEN}}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/$\{{github.repository}}:$\{{github.ref_name}}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Alternative: publish the static bundle directly, e.g.
      # - name: Deploy to S3
      #   run: aws s3 sync frontend/dist s3://$\{{secrets.S3_BUCKET}} --delete
