# ==============================================================================
# {{projectName}} — Docker Compose
# Stack: web-static
# Generated by specforge
#
# A static site has a single service: the built SPA served by nginx.
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Frontend — static React application (nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
