# ==============================================================================
# {{projectName}} — Azure DevOps Pipeline
# Stack: web-static
# Generated by specforge
# ==============================================================================

trigger:
  branches:
    include: [main, develop]

pr:
  branches:
    include: [main, develop]

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "20.x"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: $(nodeVersion)
    displayName: Install Node.js

  - script: npm ci
    workingDirectory: frontend
    displayName: Install dependencies

  - script: npm run lint
    workingDirectory: frontend
    displayName: Lint

  - script: npm run test
    workingDirectory: frontend
    displayName: Test

  - script: npm run build
    workingDirectory: frontend
    displayName: Build

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: frontend/dist
      artifactName: dist
    displayName: Publish build artifact
