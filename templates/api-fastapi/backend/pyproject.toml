[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{projectName}}"
version = "0.0.1"
description = "{{projectName}} API — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
{{#if (eq decision_caching "redis")}}    "redis>=5.0.0",
    "fastapi-cache2[redis]>=0.2.0",
{{/if}}{{#if (eq decision_queue "celery")}}    "celery[redis]>=5.3.0",
{{/if}}{{#if (eq decision_queue "arq")}}    "arq>=0.25.0",
{{/if}}{{#if (eq decision_backgroundJobs "celery-beat")}}    "celery[redis]>=5.3.0",
{{/if}}{{#if (eq decision_backgroundJobs "apscheduler")}}    "apscheduler>=3.10.0",
{{/if}}{{#if (eq decision_streaming "kafka")}}    "confluent-kafka>=2.3.0",
{{/if}}{{#if (eq decision_search "meilisearch")}}    "meilisearch>=0.31.0",
{{/if}}{{#if (eq decision_search "elasticsearch")}}    "elasticsearch>=8.0.0",
{{/if}}{{#if (eq decision_fileStorage "s3")}}    "boto3>=1.34.0",
{{/if}}{{#if (eq decision_fileStorage "gcs")}}    "google-cloud-storage>=2.14.0",
{{/if}}{{#if (eq decision_fileStorage "azure-blob")}}    "azure-storage-blob>=12.19.0",
{{/if}}]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
