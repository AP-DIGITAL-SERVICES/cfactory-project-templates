# ==============================================================================
# {{projectName}} — Azure DevOps Pipeline
# Stack: web-fastapi
# Generated by specforge
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: "ubuntu-latest"

variables:
  pythonVersion: "3.12"

stages:
  # --------------------------------------------------------------------------
  # Build & Test
  # --------------------------------------------------------------------------
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: LintAndTypeCheck
        displayName: "Lint & Type Check"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Setup Python"

          - script: pip install uv
            displayName: "Install uv"

          - script: uv pip install --system -r pyproject.toml
            displayName: "Install dependencies"

          - script: ruff check src/
            displayName: "Lint (ruff)"

          - script: ruff format --check src/
            displayName: "Format check"

          - script: mypy src/
            displayName: "Type check (mypy)"

      - job: UnitTests
        displayName: "Unit Tests"
        dependsOn: LintAndTypeCheck
        services:
          postgres:
            image: postgres:16-alpine
            ports:
              - 5432:5432
            env:
              POSTGRES_USER: test
              POSTGRES_PASSWORD: test
              POSTGRES_DB: test
{{#if (or (eq decision_caching "redis") (eq decision_queue "celery") (eq decision_queue "arq"))}}
          redis:
            image: redis:7-alpine
            ports:
              - 6379:6379
{{/if}}
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: "Setup Python"

          - script: pip install uv
            displayName: "Install uv"

          - script: uv pip install --system -r pyproject.toml
            displayName: "Install dependencies"

          - script: pytest --cov=src --cov-report=xml --junitxml=junit.xml
            displayName: "Run unit tests"
            env:
              DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
{{#if (or (eq decision_caching "redis") (eq decision_queue "celery") (eq decision_queue "arq"))}}
              REDIS_URL: redis://localhost:6379
{{/if}}

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/junit.xml"
            displayName: "Publish test results"

          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: "coverage.xml"
            displayName: "Publish coverage"

  # --------------------------------------------------------------------------
  # Docker Build (Backend + Frontend)
  # --------------------------------------------------------------------------
  - stage: DockerBuild
    displayName: "Build Docker Images"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImages
        displayName: "Build & Push Images"
        steps:
          - task: Docker@2
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)-backend"
              command: "buildAndPush"
              Dockerfile: "backend/Dockerfile"
              buildContext: "backend"
              tags: |
                $(Build.BuildId)
                latest
            displayName: "Build and push backend image"

          - task: Docker@2
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)-frontend"
              command: "buildAndPush"
              Dockerfile: "frontend/Dockerfile"
              buildContext: "frontend"
              tags: |
                $(Build.BuildId)
                latest
            displayName: "Build and push frontend image"

  # --------------------------------------------------------------------------
  # Deploy (customize per environment)
  # --------------------------------------------------------------------------
  - stage: DeployStaging
    displayName: "Deploy to Staging"
    dependsOn: DockerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployStaging
        displayName: "Deploy to Staging"
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "TODO: Add deployment steps for your cloud provider"
                  displayName: "Deploy"
