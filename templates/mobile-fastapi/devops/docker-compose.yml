# ==============================================================================
# {{projectName}} — Docker Compose (Mobile Backend)
# Stack: mobile-fastapi
# Generated by specforge
#
# Services are conditionally included based on architectural decisions.
# Remove or comment out services you don't need.
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # API — FastAPI application (mobile backend)
  # --------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
{{#if (or (eq decision_caching "redis") (eq decision_queue "arq"))}}
      - REDIS_URL=redis://redis:6379
{{/if}}
{{#if (eq decision_queue "celery")}}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
{{/if}}
{{#if (eq decision_pushNotifications "fcm")}}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/firebase-service-account.json
{{/if}}
{{#if (eq decision_pushNotifications "fcm-apns")}}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/firebase-service-account.json
      - APNS_KEY_PATH=/app/config/apns-key.p8
      - APNS_KEY_ID=${APNS_KEY_ID}
      - APNS_TEAM_ID=${APNS_TEAM_ID}
{{/if}}
{{#if (eq decision_search "meilisearch")}}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
{{/if}}
{{#if (eq decision_search "elasticsearch")}}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
{{/if}}
{{#if (eq decision_fileStorage "s3")}}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-local-bucket}
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
{{/if}}
    depends_on:
      postgres:
        condition: service_healthy
{{#if (or (eq decision_caching "redis") (eq decision_queue "celery") (eq decision_queue "arq"))}}
      redis:
        condition: service_healthy
{{/if}}
    restart: unless-stopped
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

{{#if (or (eq decision_caching "redis") (eq decision_queue "celery") (eq decision_queue "arq") (eq decision_streaming "redis-streams"))}}
  # --------------------------------------------------------------------------
  # Redis — caching / queues / streams
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
{{/if}}

{{#if (eq decision_queue "celery")}}
  # --------------------------------------------------------------------------
  # Celery Worker
  # --------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
{{#if (or (eq decision_pushNotifications "fcm") (eq decision_pushNotifications "fcm-apns"))}}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/firebase-service-account.json
{{/if}}
{{#if (eq decision_pushNotifications "fcm-apns")}}
      - APNS_KEY_PATH=/app/config/apns-key.p8
      - APNS_KEY_ID=${APNS_KEY_ID}
      - APNS_TEAM_ID=${APNS_TEAM_ID}
{{/if}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler
  # --------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
{{/if}}

{{#if (eq decision_search "meilisearch")}}
  # --------------------------------------------------------------------------
  # Meilisearch — full-text search engine
  # --------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1
    ports:
      - "${MEILI_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_ENV: development
    volumes:
      - meilisearch-data:/meili_data
    restart: unless-stopped
    networks:
      - app-network
{{/if}}

{{#if (eq decision_search "elasticsearch")}}
  # --------------------------------------------------------------------------
  # Elasticsearch / OpenSearch
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - app-network
{{/if}}

{{#if (eq decision_streaming "kafka")}}
  # --------------------------------------------------------------------------
  # Kafka + Zookeeper — event streaming
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - app-network
{{/if}}

{{#if (eq decision_fileStorage "s3")}}
  # --------------------------------------------------------------------------
  # MinIO — S3-compatible local storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - app-network
{{/if}}

volumes:
  postgres-data:
{{#if (or (eq decision_caching "redis") (eq decision_queue "celery") (eq decision_queue "arq") (eq decision_streaming "redis-streams"))}}
  redis-data:
{{/if}}
{{#if (eq decision_search "meilisearch")}}
  meilisearch-data:
{{/if}}
{{#if (eq decision_search "elasticsearch")}}
  elasticsearch-data:
{{/if}}
{{#if (eq decision_fileStorage "s3")}}
  minio-data:
{{/if}}

networks:
  app-network:
    driver: bridge
