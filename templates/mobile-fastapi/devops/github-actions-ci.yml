# ==============================================================================
# {{projectName}} — GitHub Actions CI Pipeline (Mobile Backend)
# Stack: mobile-fastapi
# Generated by specforge
# ==============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-$\{{github.ref}}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------------
  # Lint & Type Check
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: $\{{env.PYTHON_VERSION}}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml

      - name: Lint (ruff)
        run: ruff check src/

      - name: Format check (ruff)
        run: ruff format --check src/

      - name: Type check (mypy)
        run: mypy src/

  # --------------------------------------------------------------------------
  # Unit Tests
  # --------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
{{#if (or (eq decision_caching "redis") (eq decision_queue "celery") (eq decision_queue "arq"))}}
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
{{/if}}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: $\{{env.PYTHON_VERSION}}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r pyproject.toml

      - name: Run tests
        run: pytest --cov=src --cov-report=xml --junitxml=junit.xml
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
{{#if (or (eq decision_caching "redis") (eq decision_queue "celery") (eq decision_queue "arq"))}}
          REDIS_URL: redis://localhost:6379
{{/if}}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # --------------------------------------------------------------------------
  # Build Docker Image (Backend)
  # --------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: {{projectName}}-backend:$\{{github.sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
