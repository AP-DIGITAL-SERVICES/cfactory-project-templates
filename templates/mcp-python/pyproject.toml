[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{projectName}}"
version = "0.0.1"
description = "{{projectName}} — MCP server (Python / FastMCP)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
{{#if (eq decision_mcpTransport "http")}}    "uvicorn[standard]>=0.29.0",
{{/if}}{{#if (eq decision_mcpTransport "sse")}}    "uvicorn[standard]>=0.29.0",
{{/if}}{{#if (eq decision_mcpAuth "jwt-bearer")}}    "python-jose[cryptography]>=3.3.0",
{{/if}}{{#if (eq decision_mcpAuth "oauth2")}}    "authlib>=1.3.0",
    "httpx>=0.27.0",
{{/if}}{{#if (eq decision_mcpSidecars "postgres")}}    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
{{/if}}{{#if (eq decision_mcpSidecars "redis")}}    "redis>=5.0.0",
{{/if}}]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
serve = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
