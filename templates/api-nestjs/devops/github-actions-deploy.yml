name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-$\{{github.event.inputs.environment || 'production'}}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: $\{{github.repository}}

jobs:
  # --------------------------------------------------------------------------
  # Build & Push Docker Image
  # --------------------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: $\{{steps.meta.outputs.tags}}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: $\{{env.REGISTRY}}
          username: $\{{github.actor}}
          password: $\{{secrets.GITHUB_TOKEN}}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: $\{{env.REGISTRY}}/$\{{env.IMAGE_NAME}}
          tags: |
            type=semver,pattern=\{{version}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: $\{{steps.meta.outputs.tags}}
          labels: $\{{steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Database Migrations
  # --------------------------------------------------------------------------
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: $\{{github.event.inputs.environment || 'production'}}
    steps:
      - uses: actions/checkout@v4

      # TODO: Replace with your migration command and DATABASE_URL secret
      - name: Run migrations
        run: |
          echo "TODO: Run database migrations"
          echo "Example: npx typeorm migration:run -d dist/data-source.js"
        env:
          DATABASE_URL: $\{{secrets.DATABASE_URL}}

  # --------------------------------------------------------------------------
  # Deploy
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to $\{{github.event.inputs.environment || 'production'}}
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    environment: $\{{github.event.inputs.environment || 'production'}}
    steps:
      # TODO: Replace with your cloud provider deployment steps
      - name: Deploy
        run: |
          echo "TODO: Add deployment steps for your cloud provider"
          echo "Image: $\{{needs.build-and-push.outputs.image-tag}}"
