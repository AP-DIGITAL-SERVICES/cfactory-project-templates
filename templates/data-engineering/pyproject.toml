[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{projectName}}"
version = "0.0.1"
description = "{{projectName}} — data engineering project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
{{#if (eq decision_dataWarehouse "postgresql")}}    "psycopg2-binary>=2.9.0",
{{/if}}{{#if (eq decision_dataWarehouse "bigquery")}}    "google-cloud-bigquery>=3.19.0",
    "db-dtypes>=1.2.0",
{{/if}}{{#if (eq decision_dataWarehouse "snowflake")}}    "snowflake-sqlalchemy>=1.6.0",
{{/if}}{{#if (eq decision_dataWarehouse "duckdb")}}    "duckdb>=0.10.0",
{{/if}}{{#if (eq decision_orchestrator "airflow")}}    "apache-airflow>=2.9.0",
{{/if}}{{#if (eq decision_orchestrator "prefect")}}    "prefect>=2.19.0",
{{/if}}{{#if (eq decision_orchestrator "dagster")}}    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
{{/if}}{{#if (eq decision_orchestrator "dbt-cloud")}}    "dbt-core>=1.8.0",
    "dbt-postgres>=1.8.0",
{{/if}}{{#if (eq decision_dataQuality "great-expectations")}}    "great-expectations>=0.18.0",
{{/if}}{{#if (eq decision_dataQuality "soda")}}    "soda-core-postgres>=3.3.0",
{{/if}}]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
