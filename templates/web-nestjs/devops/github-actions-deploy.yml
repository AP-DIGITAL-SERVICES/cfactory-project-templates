# ==============================================================================
# {{projectName}} — GitHub Actions Deploy Pipeline
# Stack: web-nestjs
# Generated by specforge
#
# This workflow deploys the application when a release is published or
# when manually triggered. Customize the deploy steps for your cloud provider.
# ==============================================================================

name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-$\{{github.event.inputs.environment || 'production'}}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: $\{{github.repository}}
  BACKEND_IMAGE: $\{{github.repository}}-backend
  FRONTEND_IMAGE: $\{{github.repository}}-frontend

jobs:
  # --------------------------------------------------------------------------
  # Build & Push Docker Image
  # --------------------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-tag: $\{{steps.meta-backend.outputs.tags}}
      frontend-tag: $\{{steps.meta-frontend.outputs.tags}}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: $\{{env.REGISTRY}}
          username: $\{{github.actor}}
          password: $\{{secrets.GITHUB_TOKEN}}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: $\{{env.REGISTRY}}/$\{{env.BACKEND_IMAGE}}
          tags: |
            type=semver,pattern=\{{version}}
            type=sha

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: $\{{env.REGISTRY}}/$\{{env.FRONTEND_IMAGE}}
          tags: |
            type=semver,pattern=\{{version}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: $\{{steps.meta-backend.outputs.tags}}
          labels: $\{{steps.meta-backend.outputs.labels}}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: $\{{steps.meta-frontend.outputs.tags}}
          labels: $\{{steps.meta-frontend.outputs.labels}}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --------------------------------------------------------------------------
  # Database Migrations
  # --------------------------------------------------------------------------
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: $\{{github.event.inputs.environment || 'production'}}
    steps:
      - uses: actions/checkout@v4

      # TODO: Replace with your migration command and DATABASE_URL secret
      - name: Run migrations
        run: |
          echo "TODO: Run database migrations"
          echo "Example: npx typeorm migration:run -d dist/data-source.js"
        env:
          DATABASE_URL: $\{{secrets.DATABASE_URL}}

  # --------------------------------------------------------------------------
  # Deploy
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to $\{{github.event.inputs.environment || 'production'}}
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    environment: $\{{github.event.inputs.environment || 'production'}}
    steps:
      # TODO: Replace with your cloud provider deployment steps
      # Examples:
      #   - AWS ECS: aws ecs update-service
      #   - Fly.io: flyctl deploy
      #   - Kubernetes: kubectl set image
      - name: Deploy
        run: |
          echo "TODO: Add deployment steps for your cloud provider"
          echo "Backend image: $\{{needs.build-and-push.outputs.backend-tag}}"
          echo "Frontend image: $\{{needs.build-and-push.outputs.frontend-tag}}"
