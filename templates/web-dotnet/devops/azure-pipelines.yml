# ==============================================================================
# {{projectName}} — Azure DevOps Pipeline
# Stack: web-dotnet
# Generated by specforge
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: "ubuntu-latest"

variables:
  nodeVersion: "20.x"
  npmCacheFolder: $(Pipeline.Workspace)/.npm

stages:
  # --------------------------------------------------------------------------
  # Build & Test
  # --------------------------------------------------------------------------
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: LintAndTypeCheck
        displayName: "Lint & Type Check"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: "Setup Node.js"

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npmCacheFolder)
            displayName: "Cache npm"

          - script: npm ci
            displayName: "Install dependencies"

          - script: npm run lint
            displayName: "Lint"

          - script: npm run typecheck
            displayName: "Type check"

      - job: UnitTests
        displayName: "Unit Tests"
        dependsOn: LintAndTypeCheck
        services:
          postgres:
            image: postgres:16-alpine
            ports:
              - 5432:5432
            env:
              POSTGRES_USER: test
              POSTGRES_PASSWORD: test
              POSTGRES_DB: test
{{#if (or (eq decision_caching "redis") (eq decision_queue "bullmq"))}}
          redis:
            image: redis:7-alpine
            ports:
              - 6379:6379
{{/if}}
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: "Setup Node.js"

          - script: npm ci
            displayName: "Install dependencies"

          - script: npm run test -- --coverage
            displayName: "Run unit tests"
            env:
              DATABASE_URL: postgresql://test:test@localhost:5432/test
{{#if (or (eq decision_caching "redis") (eq decision_queue "bullmq"))}}
              REDIS_URL: redis://localhost:6379
{{/if}}

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/junit.xml"
            displayName: "Publish test results"

          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: "coverage/cobertura-coverage.xml"
            displayName: "Publish coverage"

      - job: E2ETests
        displayName: "E2E Tests"
        dependsOn: LintAndTypeCheck
        services:
          postgres:
            image: postgres:16-alpine
            ports:
              - 5432:5432
            env:
              POSTGRES_USER: test
              POSTGRES_PASSWORD: test
              POSTGRES_DB: test_e2e
{{#if (or (eq decision_caching "redis") (eq decision_queue "bullmq"))}}
          redis:
            image: redis:7-alpine
            ports:
              - 6379:6379
{{/if}}
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: "Setup Node.js"

          - script: npm ci
            displayName: "Install dependencies"

          - script: npm run test:e2e
            displayName: "Run E2E tests"
            env:
              DATABASE_URL: postgresql://test:test@localhost:5432/test_e2e
{{#if (or (eq decision_caching "redis") (eq decision_queue "bullmq"))}}
              REDIS_URL: redis://localhost:6379
{{/if}}

  # --------------------------------------------------------------------------
  # Docker Build (Backend + Frontend)
  # --------------------------------------------------------------------------
  - stage: DockerBuild
    displayName: "Build Docker Images"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImages
        displayName: "Build & Push Images"
        steps:
          - task: Docker@2
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)-backend"
              command: "buildAndPush"
              Dockerfile: "backend/Dockerfile"
              buildContext: "backend"
              tags: |
                $(Build.BuildId)
                latest
            displayName: "Build and push backend image"

          - task: Docker@2
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)-frontend"
              command: "buildAndPush"
              Dockerfile: "frontend/Dockerfile"
              buildContext: "frontend"
              tags: |
                $(Build.BuildId)
                latest
            displayName: "Build and push frontend image"

  # --------------------------------------------------------------------------
  # Deploy (customize per environment)
  # --------------------------------------------------------------------------
  - stage: DeployStaging
    displayName: "Deploy to Staging"
    dependsOn: DockerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployStaging
        displayName: "Deploy to Staging"
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "TODO: Add deployment steps for your cloud provider"
                  displayName: "Deploy"
